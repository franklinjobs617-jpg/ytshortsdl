body,
html {
    background-color: #fff;
    border: 0;
    font-family: "TT Norms", Arial, Helvetica, sans-serif;
    font-size: 100%;
    margin: 0;
    padding: 0
}

html * {
    -ms-touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box
}

aside,
footer,
header,
main,
section {
    display: block
}

.container {
    margin: 0 auto;
    max-width: 1200px;
    padding: 0 25px
}

.page-wrap {
    display: flex;
    flex-direction: column;
    height: 100vh
}

header {
    background-color: #fff;
    box-shadow: inset 0px -1px 0px #E7E7E7;
    padding: 15px 0
}

main {
    flex: 1 0 auto
}

.error-content {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    flex-flow: column;
    justify-content: space-around;
    padding: 10px 0
}

.error-message,
.cf-im-under-attack, 
.error-image ~ .error-details,
.cf-im-under-attack ~ .error-details {
    padding: 15px 0;
    max-width: 355px;
}

.error-message h1 {
    font-size: 28px;
    line-height: 36px;
    margin: 0 0 15px;
    text-align: left
}

.error-message p {
    font-size: 16px;
    line-height: 20px;
}

.error-content>.error-details {
    width: 355px;
}

.error-details {
    color: #717171;
}

.error-details p {
    margin: 4px 0;
}

footer {
    background-color: #f7f7f7;
    flex-shrink: 0;
    font-size: 16px;
    padding: 15px 0
}

.footer-content {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between
